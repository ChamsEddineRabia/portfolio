name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local logo assets
        run: |
          cat assets/logos/chunks/*.b64 > /tmp/logo-sprite.b64
          base64 -d /tmp/logo-sprite.b64 > assets/logos/logo-sprite.png
          python3 - <<'PY'
          import struct,zlib
          p='assets/logos/logo-sprite.png'
          b=open(p,'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n','bad PNG signature'
          i=8
          w=h=None
          while i < len(b):
              n=struct.unpack('>I',b[i:i+4])[0]
              typ=b[i+4:i+8]
              dat=b[i+8:i+8+n]
              crc=struct.unpack('>I',b[i+8+n:i+12+n])[0]
              assert (zlib.crc32(typ+dat)&0xffffffff)==crc, f'bad CRC in {typ!r}'
              if typ==b'IHDR': w,h=struct.unpack('>II',dat[:8])
              i += 12+n
              if typ==b'IEND': break
          assert (w,h)==(1800,120), f'unexpected size {(w,h)}'
          print('logo sprite OK',w,h)
          PY
          rm -rf assets/logos/chunks assets/logos/source
          rm -f assets/logos/logo-sprite.b64
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
