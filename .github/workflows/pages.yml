name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local logo assets
        run: |
          cat assets/logos/chunks/*.b64 > /tmp/logo-sprite.b64
          base64 -d /tmp/logo-sprite.b64 > assets/logos/logo-sprite.png
          echo "2b73948e88d979818c85dad87bfe1b62f5b0eb8d7efa46517244c6f4403d9033  assets/logos/logo-sprite.png" | sha256sum -c -
          rm -rf assets/logos/chunks assets/logos/source
          rm -f assets/logos/logo-sprite.b64
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
