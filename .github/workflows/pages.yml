name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build local logo PNGs and social preview
        run: |
          python3 -m pip install --quiet pillow
          cat assets/logos/chunks/*.b64 > /tmp/logo-sprite.b64
          base64 -d /tmp/logo-sprite.b64 > /tmp/logo-sprite.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import re, base64, io

          # Rebuild original local company/institution logos.
          sprite = Image.open('/tmp/logo-sprite.png').convert('RGBA')
          if sprite.size != (1800, 120):
              raise SystemExit(f'Unexpected sprite size: {sprite.size}')
          crops = {
              'nesr':        (39, 12, 161, 108),
              'labelle':     (215, 22, 385, 98),
              'processtool': (446, 12, 554, 108),
              'umbb':        (647, 23, 752, 97),
              'fhc':         (850, 9, 950, 111),
              'sonatrach':   (1067, 11, 1132, 108),
              'fertial':     (1215, 42, 1385, 78),
              'linde':       (1415, 36, 1585, 84),
              'saidal':      (1656, 12, 1744, 108),
          }
          out = Path('assets/logos')
          out.mkdir(parents=True, exist_ok=True)
          for name, box in crops.items():
              sprite.crop(box).save(out / f'{name}.png', optimize=True)

          # Build the 1200x630 LinkedIn / WhatsApp / Open Graph card from the portfolio portrait.
          photo_js = Path('assets/photo.js').read_text(encoding='utf-8')
          m = re.search(r'window\.__profilePhoto\s*=\s*["\']([^"\']+)', photo_js)
          if not m:
              raise SystemExit('Profile photo data was not found')
          portrait = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')

          W, H = 1200, 630
          card = Image.new('RGB', (W, H), '#f3f3f0')
          draw = ImageDraw.Draw(card)
          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          f_name = ImageFont.truetype(bold, 58)
          f_title = ImageFont.truetype(bold, 27)
          f_small = ImageFont.truetype(regular, 22)
          f_mini = ImageFont.truetype(bold, 18)

          draw.rounded_rectangle((46,46,W-46,H-46), radius=28, outline='#c9c9c3', width=2)
          draw.rounded_rectangle((72,72,142,142), radius=18, fill='#111111')
          box = draw.textbbox((0,0), 'CER', font=f_mini)
          draw.text((107-(box[2]-box[0])/2, 107-(box[3]-box[1])/2-1), 'CER', font=f_mini, fill='white')
          draw.text((72,185), 'CHAMS EDDINE', font=f_name, fill='#111111')
          draw.text((72,250), 'RABIA.', font=f_name, fill='#9a9a95')
          draw.text((72,345), 'Petroleum | Petrochemical &', font=f_title, fill='#111111')
          draw.text((72,382), 'Process Engineer', font=f_title, fill='#111111')
          draw.text((72,447), 'Annaba, Algeria · Open to relocation &', font=f_small, fill='#555555')
          draw.text((72,477), 'international engineering opportunities', font=f_small, fill='#555555')
          draw.text((72,540), 'linkedin.com/in/chams-eddine-rabia', font=f_mini, fill='#111111')
          draw.text((570,540), '+213 676 309 104', font=f_mini, fill='#111111')

          side = min(portrait.size)
          left = (portrait.width-side)//2
          top = max(0, int((portrait.height-side)*0.25))
          portrait = portrait.crop((left, top, left+side, top+side))
          portrait = ImageOps.fit(portrait, (390,390), method=Image.Resampling.LANCZOS, centering=(0.5,0.38))
          mask = Image.new('L', (390,390), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle((0,0,389,389), radius=22, fill=255)
          card.paste(portrait, (742,120), mask)
          draw.rounded_rectangle((742,120,1132,510), radius=22, outline='#111111', width=2)

          social = Path('assets/social')
          social.mkdir(parents=True, exist_ok=True)
          card.save(social / 'chams-eddine-rabia-og.jpg', quality=88, optimize=True, progressive=True)
          print('Built social preview:', social / 'chams-eddine-rabia-og.jpg')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
