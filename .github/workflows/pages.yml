name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build local logo PNGs
        run: |
          python3 -m pip install --quiet pillow
          cat assets/logos/chunks/*.b64 > /tmp/logo-sprite.b64
          base64 -d /tmp/logo-sprite.b64 > /tmp/logo-sprite.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          sprite = Image.open('/tmp/logo-sprite.png').convert('RGBA')
          if sprite.size != (1800, 120):
              raise SystemExit(f'Unexpected sprite size: {sprite.size}')

          crops = {
              'nesr':        (39, 12, 161, 108),
              'labelle':     (215, 22, 385, 98),
              'processtool': (446, 12, 554, 108),
              'umbb':        (647, 23, 752, 97),
              'fhc':         (850, 9, 950, 111),
              'sonatrach':   (1067, 11, 1132, 108),
              'fertial':     (1215, 42, 1385, 78),
              'linde':       (1415, 36, 1585, 84),
              'saidal':      (1656, 12, 1744, 108),
          }

          out = Path('assets/logos')
          out.mkdir(parents=True, exist_ok=True)
          for name, box in crops.items():
              logo = sprite.crop(box)
              logo.save(out / f'{name}.png', optimize=True)
              print(name, logo.size)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
